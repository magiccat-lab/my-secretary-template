# pre-commit hook: sanitize_lint + Python compile
# install: pip install pre-commit && pre-commit install
# 詳細は docs/setup/sanitize.md
repos:
  - repo: local
    hooks:
      - id: sanitize-lint
        name: sanitize-lint [PII / secret 検出]
        entry: python3 scripts/lib/sanitize_lint.py
        language: system
        types_or: [python, markdown, text, json, yaml]
        pass_filenames: true

      - id: py-compile
        name: py-compile [Python 構文チェック]
        entry: python3 -m compileall -q
        language: system
        types: [python]
        pass_filenames: true
